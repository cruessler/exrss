version: 2
updates:
  - package-ecosystem: mix
    directory: '/'

    schedule:
      interval: monthly

    assignees:
      - "cruessler"

    groups:
      misc:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: npm
    directory: '/assets'

    schedule:
      interval: weekly
      day: saturday

    assignees:
      - "cruessler"

    groups:
      tailwind:
        patterns:
          - '@tailwindcss/*'
          - 'tailwindcss'
        update-types:
          - 'minor'
          - 'patch'
      misc:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: github-actions
    directory: '/'

    schedule:
      interval: weekly
      day: saturday

    assignees:
      - "cruessler"
